<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install VP8 - iOS WebClip Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      object-fit: cover;
      margin: 0 auto 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255,255,255,0.1);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 16px;
      width: 100%;
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .steps {
      margin-top: 28px;
      text-align: left;
      background: #0f172a;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #334155;
    }
    .steps h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #cbd5e1; margin-bottom: 10px; }
    .steps ol { padding-left: 20px; font-size: 12px; color: #94a3b8; line-height: 1.8; }
  </style>
</head>
